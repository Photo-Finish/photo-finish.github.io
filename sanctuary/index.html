<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amphoreus — the Sanctuary</title>
<style>
 body{margin:0;background:#0b0a14;color:#e8dfc8;font-family:system-ui,Segoe UI,sans-serif}
 .bar{padding:8px 14px;background:#141128;border-bottom:1px solid #2a2440;font-size:.85rem;
      display:flex;gap:14px;align-items:center}
 a{color:#7fb0ff;text-decoration:none}
 .msg{color:#8d84a8;padding:20px}
</style>
</head>
<body>
<div class="bar">
  <span><a href="/">World hub</a></span>
  <span>The Sanctuary — full interface (sign-in required)</span>
</div>
<div id="frame" style="position:fixed;inset:37px 0 0 0">
  <p class="msg">Loading the Sanctuary…</p>
</div>
<script src="../config.js?1786886978"></script>
<script>
 var s = window.AMPHOREUS || {};
 var url = s.ui || "";
 var f = document.getElementById("frame");
 if (url) {
   f.innerHTML = '<iframe src="' + url + '" title="Amphoreus Sanctuary" '
     + 'style="position:absolute;top:0;left:0;width:100%;height:100%;border:0"></iframe>';
 } else {
   f.innerHTML = '<p class="msg">Oh, Zagreus stole the host machine — the Sanctuary is not reachable right now.</p>';
 }
</script>
</body>
</html>

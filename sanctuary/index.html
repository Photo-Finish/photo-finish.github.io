<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amphoreus — the Sanctuary</title>
<style>
 body{margin:0;background:#0b0a14;color:#e8dfc8;font-family:system-ui,Segoe UI,sans-serif}
 .bar{padding:8px 14px;background:#141128;border-bottom:1px solid #2a2440;font-size:.85rem;
      display:flex;gap:14px;align-items:center}
 a{color:#7fb0ff;text-decoration:none}
 .msg{color:#8d84a8;padding:20px}
</style>
</head>
<body>
<div class="bar">
  <span><a href="/">World hub</a></span>
  <span>The Sanctuary — full interface (sign-in required)</span>
</div>
<div id="frame" style="position:fixed;inset:37px 0 0 0">
  <p class="msg">Loading the Sanctuary…</p>
</div>
<script src="../config.js?1787053167"></script>
<script>
 var s = window.AMPHOREUS || {};
 var url = s.ui || "";
 var f = document.getElementById("frame");
 function embed(){
   f.innerHTML = '<iframe src="' + url + '" title="Amphoreus Sanctuary" '
     + 'style="position:absolute;top:0;left:0;width:100%;height:100%;border:0"></iframe>';
 }
 function offline(){
   f.innerHTML = '<div style="text-align:center;padding:40px 20px">'
     + '<div style="font-size:1.2rem;font-weight:600;color:#ffb45e">Oh, Zagreus stole the host machine.</div>'
     + '<div class="msg" style="color:#8d84a8">The world is offline right now — it will return when the machine is back online.</div>'
     + '</div>';
 }
 if (!url) { offline(); }
 else {
   // Probe the world before embedding: if the machine is offline, show the
   // funny message instead of a raw tunnel error inside the frame. A couple of
   // retries ride over the browser's occasional first-connection hiccup.
   var tries = 0;
   var probe = function(){
     fetch((s.status || url) + "/healthz", {cache: "no-store"})
       .then(function(r){ if (!r.ok) throw new Error("bad"); embed(); })
       .catch(function(){
         tries++;
         if (tries < 3) { setTimeout(probe, 1000); } else { offline(); }
       });
   };
   probe();
 }
</script>
</body>
</html>

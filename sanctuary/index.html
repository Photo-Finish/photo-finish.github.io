<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amphoreus — the Sanctuary</title>
<style>
 body{margin:0;background:#0b0a14;color:#e8dfc8;font-family:system-ui,Segoe UI,sans-serif}
 .bar{padding:8px 14px;background:#141128;border-bottom:1px solid #2a2440;font-size:.85rem;
      display:flex;gap:14px;align-items:center}
 a{color:#7fb0ff;text-decoration:none}
 .msg{color:#8d84a8;padding:20px}
</style>
</head>
<body>
<div class="bar">
  <span><a href="/">World hub</a></span>
  <span>The Sanctuary — full interface (sign-in required)</span>
</div>
<div id="frame" style="position:fixed;inset:37px 0 0 0">
  <p class="msg">Loading the Sanctuary…</p>
</div>
<script src="../config.js?1789609165"></script>
<script>
 var s = window.AMPHOREUS || {};
 var url = s.ui || "";
 var f = document.getElementById("frame");
 function embed(){
   f.innerHTML = '<iframe src="' + url + '" title="Amphoreus Sanctuary" '
     + 'style="position:absolute;top:0;left:0;width:100%;height:100%;border:0"></iframe>';
 }
 function offline(){
   f.innerHTML = '<div style="text-align:center;padding:40px 20px">'
     + '<div style="font-size:1.2rem;font-weight:600;color:#ffb45e">Oh, Zagreus stole the host machine.</div>'
     + '<div class="msg" style="color:#8d84a8">The world is offline right now — it will return when the machine is back online.</div>'
     + '</div>';
 }
 function waitingDoor(){
   f.innerHTML = '<div style="text-align:center;padding:40px 20px">'
     + '<div style="font-size:1.2rem;font-weight:600;color:#e8dfc8">The host is awake.</div>'
     + '<div class="msg" style="color:#8d84a8">The Sanctuary door is still unlocking — wait a moment and refresh.</div>'
     + '</div>';
 }
 function ping(base, path){
   return fetch(base + path + (path.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now(), {
     cache: "no-store", mode: "cors"
   }).then(function(r){ if (!r.ok) throw new Error("bad"); return r; });
 }
 function hostUp(){
   var probes = [];
   if (s.status) {
     probes.push(ping(s.status, "/healthz"));
     probes.push(ping(s.status, "/api/status"));
   }
   if (url) {
     probes.push(ping(url, "/_stcore/health"));
     probes.push(ping(url, "/healthz"));
   }
   if (!probes.length) return Promise.reject(new Error("no-url"));
   return Promise.any(probes);
 }
 if (!s.status && !url) { offline(); }
 else {
   var tries = 0;
   var probe = function(){
     hostUp()
       .then(function(){ if (url) embed(); else waitingDoor(); })
       .catch(function(){
         tries++;
         if (tries < 6) { setTimeout(probe, 1200); }
         else { offline(); }
       });
   };
   probe();
 }
</script>
</body>
</html>

<title>Amphoreus — world status</title>
<style>
 body{margin:0;background:#0b0a14;color:#8d84a8;font-family:system-ui,Segoe UI,sans-serif;
      min-height:100vh;display:flex;align-items:center;justify-content:center}

<body>
<p>Opening the world status… <a id="go" href="#">click here if nothing happens</a></p>
<script src="../config.js"></script>
<script>
  var s = window.AMPHOREUS || {};
  var url = s.status || "/";
  document.getElementById("go").href = url;
  window.location.replace(url);
</script>
